<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>alex is the best</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;color:#f0f0f5;padding:24px;
    background:#030308;overflow-x:hidden;position:relative;
}

/* bolha 1 */
.bg-blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:-3;pointer-events:none}

.b1{
    width:60vw;height:60vw;max-width:800px;max-height:800px;
    background:#7c3aed;
    top:-15%;left:-15%;opacity:.7;
    animation:b1move 20s ease-in-out infinite;
}
@keyframes b1move{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40%,30%) scale(1.3)}
}

.b2{
    width:55vw;height:55vw;max-width:700px;max-height:700px;
    background:#ec4899;
    bottom:-20%;right:-10%;opacity:.65;
    animation:b2move 25s ease-in-out infinite;
}
@keyframes b2move{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-35%,-25%) scale(1.25)}
}

.b3{
    width:50vw;height:50vw;max-width:650px;max-height:650px;
    background:#3b82f6;
    top:35%;left:40%;opacity:.55;
    animation:b3move 18s ease-in-out infinite;
}
@keyframes b3move{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(-30%,20%) scale(1.15)}
    66%{transform:translate(25%,-25%) scale(1.35)}
}

.b4{
    width:45vw;height:45vw;max-width:550px;max-height:550px;
    background:#06b6d4;
    bottom:10%;left:10%;opacity:.45;
    animation:b4move 22s ease-in-out infinite;
}
@keyframes b4move{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(35%,-30%) scale(1.2)}
}

.vignette{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at center,rgba(0,0,0,.2) 0%,rgba(0,0,0,.85) 100%);
}

.card{
    background:rgba(14,14,22,.72);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(30px) saturate(1.2);
    -webkit-backdrop-filter:blur(30px) saturate(1.2);
    border-radius:26px;padding:40px 34px 34px;
    text-align:center;max-width:400px;width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
    animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
}
@keyframes fadeUp{
    from{opacity:0;transform:translateY(28px)}
    to{opacity:1;transform:translateY(0)}
}

.avatar-wrap{position:relative;display:inline-block;margin-bottom:22px}
.avatar-wrap::before{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    background:conic-gradient(from 0deg,#a78bfa,#f472b6,#60a5fa,#a78bfa);
    opacity:.65;filter:blur(12px);animation:spin 6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar{
    position:relative;width:110px;height:110px;border-radius:50%;
    object-fit:cover;border:3px solid rgba(255,255,255,.15);display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s;
}
.avatar:hover{transform:scale(1.05)}

h1{
    font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;
    background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.tag{font-size:13px;color:#7a7a8c;margin-bottom:8px;font-weight:500}
.community{
    display:inline-block;font-size:10px;color:#c4b5fd;letter-spacing:1.8px;
    text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:20px;
    background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
    margin-bottom:20px;
}
.bio{font-size:13.5px;color:#a8a8b8;line-height:1.65;margin-bottom:22px}

.favs{
    text-align:left;background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);border-radius:14px;
    padding:14px 16px;margin-bottom:22px;
}
.favs-title{
    font-size:9.5px;color:#a78bfa;letter-spacing:1.8px;
    text-transform:uppercase;font-weight:700;margin-bottom:11px;
}
.fav-item{
    display:flex;align-items:center;gap:11px;padding:8px;border-radius:8px;
    cursor:pointer;transition:background .15s;font-size:12.5px;color:#c8c8d8;
}
.fav-item:hover{background:rgba(255,255,255,.04)}
.fav-item.active{background:rgba(167,139,250,.1);color:#e0d5ff}
.play-icon{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;flex-shrink:0;background:rgba(255,255,255,.06);
    color:#a78bfa;transition:all .15s;
}
.fav-item.active .play-icon{background:#a78bfa;color:#fff}

.links{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.links a{
    color:#eaeaea;text-decoration:none;font-size:12.5px;
    padding:10px 18px;border-radius:11px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
    transition:all .2s;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;
}
.links a svg{transition:transform .2s}
.links a:hover{
    background:rgba(255,255,255,.1);border-color:rgba(167,139,250,.3);
    transform:translateY(-2px);box-shadow:0 8px 20px rgba(167,139,250,.15);
}
.links a:hover svg{transform:scale(1.12)}

#overlay{
    position:fixed;inset:0;z-index:9999;
    background:rgba(5,5,10,.9);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .6s;
}
#overlay .inner{
    color:#fff;font-size:13px;font-weight:600;letter-spacing:3px;
    text-transform:uppercase;padding:18px 36px;
    border:1px solid rgba(255,255,255,.2);border-radius:50px;
    background:rgba(255,255,255,.02);
    animation:pulse 2s ease-in-out infinite;
    display:flex;align-items:center;gap:12px;
}
#overlay .inner::before{
    content:'';width:8px;height:8px;border-radius:50%;
    background:#a78bfa;box-shadow:0 0 14px #a78bfa;
}
@keyframes pulse{
    0%,100%{opacity:.55;transform:scale(1)}
    50%{opacity:1;transform:scale(1.02)}
}

@media (max-width:480px){
    body{padding:16px}
    .card{padding:32px 22px 26px}
    .avatar{width:96px;height:96px}
}
</style>
</head>
<body>

</div>

<div id="overlay">
    <div class="inner">entrar</div>
</div>

<audio id="player" loop></audio>

<script>
const tracks = [
    { name: 'BLUFF',           src: 'bluff.mp3' },
    { name: 'Eu Sou Blindado', src: 'blindado.mp3' },
];

const audio   = document.getElementById('player');
const items   = document.querySelectorAll('.fav-item');
const overlay = document.getElementById('overlay');

let current = 0;
let started = false;

// diagnóstico — mostra no console se os arquivos existem
(async () => {
    for (const t of tracks) {
        try {
            const r = await fetch(t.src, { method: 'HEAD' });
            console.log(`[diag] ${t.src}: HTTP ${r.status} (${r.headers.get('content-type')})`);
        } catch (e) {
            console.warn(`[diag] ${t.src}: erro —`, e.message);
        }
    }
})();

function playTrack(i) {
    current = i;
    console.log('[audio] tocando:', tracks[i].src);
    audio.src = tracks[i].src;
    audio.volume = 0.7;
    audio.play().catch(err => {
        console.warn('[audio] falhou:', err.name, err.message);
    });
    items.forEach((el, idx) => {
        el.classList.toggle('active', idx === i);
        el.querySelector('.play-icon').textContent = idx === i ? '❚❚' : '▶';
    });
}

function pauseTrack() {
    audio.pause();
    items.forEach(el => el.querySelector('.play-icon').textContent = '▶');
}

items.forEach((el, idx) => {
    el.addEventListener('click', () => {
        if (!started) {
            overlay.click();
            setTimeout(() => {
                if (idx === current && !audio.paused) pauseTrack();
                else playTrack(idx);
            }, 300);
            return;
        }
        if (idx === current && !audio.paused) pauseTrack();
        else playTrack(idx);
    });
});

overlay.addEventListener('click', () => {
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 600);
    started = true;
    playTrack(0);
});

audio.addEventListener('error', () => {
    const e = audio.error;
    console.error('[audio] erro no elemento:', e ? e.code : 'unknown', e ? e.message : '');
});
</script>
