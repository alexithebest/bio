<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>alex is the best</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;color:#f0f0f5;padding:24px;
    background:#02020a;overflow-x:hidden;position:relative;
}
.bg-video{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;
    filter:blur(12px) brightness(.45) saturate(1.3);
    transform:scale(1.1);z-index:-2;pointer-events:none;
}
.vignette{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at center,rgba(0,0,0,.15) 0%,rgba(0,0,0,.75) 100%);
}
.card{
    background:rgba(14,14,22,.75);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(30px) saturate(1.2);
    -webkit-backdrop-filter:blur(30px) saturate(1.2);
    border-radius:26px;padding:40px 34px 34px;
    text-align:center;max-width:400px;width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);
    animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.avatar{
    display:block;width:122px;height:122px;
    border-radius:50% !important;object-fit:cover;object-position:center;
    margin:0 auto 22px;border:4px solid transparent;
    background:linear-gradient(#0a0a14,#0a0a14) padding-box,
               conic-gradient(from 0deg,#a78bfa,#f472b6,#60a5fa,#a78bfa) border-box;
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 40px rgba(167,139,250,.3);
    transition:transform .35s;
}
.avatar:hover{transform:scale(1.05)}
h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;color:#fff}
.tag{font-size:13px;color:#7a7a8c;margin-bottom:8px;font-weight:500}
.community{
    display:inline-block;font-size:10px;color:#c4b5fd;letter-spacing:1.8px;
    text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:20px;
    background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
    margin-bottom:22px;
}
.bio{font-size:13.5px;color:#a8a8b8;line-height:1.65;margin-bottom:26px}
.links{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.links a{
    color:#eaeaea;text-decoration:none;font-size:12.5px;
    padding:10px 18px;border-radius:11px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
    transition:all .2s;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;
}
.links a svg{transition:transform .2s}
.links a:hover{
    background:rgba(255,255,255,.1);border-color:rgba(167,139,250,.3);
    transform:translateY(-2px);box-shadow:0 8px 20px rgba(167,139,250,.15);
}
.links a:hover svg{transform:scale(1.12)}
#welcome{
    position:fixed;inset:0;z-index:2147483647;
    background:rgba(5,5,12,.94);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .7s;
    text-align:center;padding:24px;
}
#welcome .box{max-width:520px;animation:fadeUp .8s cubic-bezier(.2,.8,.2,1)}
#welcome .who{font-size:11px;color:#a78bfa;letter-spacing:3px;
    text-transform:uppercase;font-weight:700;margin-bottom:20px}
#welcome .title{font-size:34px;font-weight:800;letter-spacing:-.5px;
    margin-bottom:20px;color:#fff}
#welcome .msg{font-size:15px;color:#c8c8d8;line-height:1.9;margin-bottom:34px}
#welcome .msg .hl{color:#f0abfc;font-weight:600}
#welcome .cta{
    display:inline-flex;align-items:center;gap:12px;
    font-size:12px;color:#fff;font-weight:600;
    letter-spacing:2.5px;text-transform:uppercase;
    padding:16px 32px;border-radius:50px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.03);
    animation:pulse 2.2s ease-in-out infinite;
}
#welcome .cta::before{
    content:'';width:8px;height:8px;border-radius:50%;
    background:#a78bfa;box-shadow:0 0 16px #a78bfa;
}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@media (max-width:480px){
    body{padding:16px}
    .card{padding:32px 22px 26px}
    .avatar{width:104px;height:104px}
    #welcome .title{font-size:24px}
    #welcome .msg{font-size:13.5px}
}
</style>
</head>

<audio id="player" loop preload="auto">
    <source src="bluff.mp3" type="audio/mpeg">
</audio>

<script>
const audio   = document.getElementById('player');
const welcome = document.getElementById('welcome');

audio.volume = 0.55;

welcome.addEventListener('click', () => {
    welcome.style.opacity = '0';
    setTimeout(() => welcome.remove(), 700);
    audio.play().catch(err => console.warn('autoplay:', err.name));
});
</script>
