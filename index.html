<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02020a">
<title>alex is the best</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
}

body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#f0f0f5;
    padding:20px;
    background:#02020a;position:relative;
}

.bg-video{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;
    filter:brightness(.6) saturate(1.15);
    z-index:-2;pointer-events:none;
}

.vignette{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(circle at center,rgba(0,0,0,.1) 0%,rgba(0,0,0,.65) 100%);
}

.card{
    background:rgba(20,20,26,.65);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(28px) saturate(1.15);
    -webkit-backdrop-filter:blur(28px) saturate(1.15);
    border-radius:26px;
    padding:40px 34px 34px;
    text-align:center;
    max-width:400px;width:100%;
    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        0 0 60px rgba(200,200,220,.06),
        0 0 120px rgba(180,180,200,.04);
    animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
    position:relative;
}
.card::before{
    content:'';position:absolute;inset:-1px;border-radius:27px;padding:1px;
    background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,rgba(200,200,220,.05) 50%,rgba(255,255,255,.15) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.avatar{
    display:block;width:122px;height:122px;
    border-radius:50% !important;object-fit:cover;object-position:center;
    margin:0 auto 22px;border:4px solid transparent;
    background:linear-gradient(#14141a,#14141a) padding-box,
               conic-gradient(from 0deg,#c4c4d4,#8a8a9a,#e0e0ec,#8a8a9a,#c4c4d4) border-box;
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 40px rgba(200,200,220,.2);
    transition:transform .35s;
}
.avatar:hover{transform:scale(1.05)}

h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;color:#f4f4f8;line-height:1.2}
.tag{font-size:13px;color:#8a8a9a;margin-bottom:8px;font-weight:500}
.community{
    display:inline-block;font-size:10px;color:#c4c4d4;letter-spacing:1.8px;
    text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:20px;
    background:rgba(220,220,240,.06);border:1px solid rgba(220,220,240,.18);
    margin-bottom:22px;
}
.bio{font-size:13.5px;color:#a8a8b8;line-height:1.65;margin-bottom:26px}

.links{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.links a{
    color:#eaeaea;text-decoration:none;font-size:12.5px;
    padding:10px 18px;border-radius:11px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    transition:all .2s;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;
}
.links a svg{transition:transform .2s}
.links a:hover,.links a:active{
    background:rgba(255,255,255,.1);border-color:rgba(220,220,240,.3);
    transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,200,220,.12);
}
.links a:hover svg{transform:scale(1.12)}

#soundBtn{
    position:fixed;
    bottom:24px;right:24px;
    width:52px;height:52px;border-radius:50%;
    background:rgba(20,20,26,.7);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .25s;z-index:100;
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(200,200,220,.08);
    color:#eaeaea;
    padding:0;
}
#soundBtn:hover,#soundBtn:active{
    background:rgba(30,30,38,.85);transform:scale(1.08);
    box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 40px rgba(200,200,220,.15);
}
#soundBtn svg{width:22px;height:22px}
#soundBtn .icon-off{display:none}
#soundBtn.muted .icon-on{display:none}
#soundBtn.muted .icon-off{display:block}
#soundBtn.muted{color:#7a7a8a}

/* WELCOME */
#welcome{
    position:fixed;inset:0;z-index:2147483647;
    background:rgba(8,8,14,.7);
    backdrop-filter:blur(24px) saturate(1.2);
    -webkit-backdrop-filter:blur(24px) saturate(1.2);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .7s;
    text-align:center;padding:20px;
}
#welcome .panel{
    background:rgba(20,20,26,.6);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    border-radius:28px;
    padding:48px 40px 36px;
    max-width:440px;width:100%;
    box-shadow:
        0 40px 90px rgba(0,0,0,.75),
        0 0 80px rgba(200,200,220,.08);
    animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
    position:relative;
}
#welcome .title{
    font-size:44px;font-weight:800;letter-spacing:8px;
    margin-bottom:26px;
    color:#fff;
    text-shadow:0 0 30px rgba(200,200,220,.25);
}
#welcome .avatar-mini{
    width:96px;height:96px;
    border-radius:50%;object-fit:cover;
    margin:0 auto 22px;display:block;
    border:3px solid transparent;
    background:linear-gradient(#14141a,#14141a) padding-box,
               conic-gradient(from 0deg,#c4c4d4,#8a8a9a,#e0e0ec,#8a8a9a,#c4c4d4) border-box;
    box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 40px rgba(200,200,220,.2);
}
#welcome .info{
    font-size:14px;color:#c8c8d8;line-height:1.8;margin-bottom:28px;
}
#welcome .info .hl{
    color:#e0e0f0;font-weight:600;
}
#welcome .sub{
    font-size:11px;color:#8a8a9a;letter-spacing:2px;
    text-transform:uppercase;font-weight:600;margin-top:8px;
}
#welcome .bar{
    width:100%;height:3px;
    background:rgba(255,255,255,.08);
    border-radius:2px;
    overflow:hidden;
    margin-top:8px;
    position:relative;
}
#welcome .bar-fill{
    position:absolute;top:0;left:0;height:100%;width:0%;
    background:linear-gradient(90deg,#c4c4d4,#e0e0ec,#fff);
    border-radius:2px;
    box-shadow:0 0 12px rgba(220,220,240,.6);
    transition:width .1s linear;
}
#welcome .bar-label{
    font-size:10px;color:#7a7a8a;letter-spacing:1.5px;
    text-transform:uppercase;text-align:center;margin-top:12px;
}
#welcome .bar-label.ready{color:#e0e0ec}

/* ========== TABLET ========== */
@media (max-width: 768px){
    body{padding:18px}
    .card{padding:36px 28px 30px;max-width:380px}
    #welcome .panel{padding:42px 34px 32px}
}

/* ========== CELULAR ========== */
@media (max-width: 520px){
    body{
        padding:16px;
        align-items:center;
    }
    .card{
        padding:32px 24px 26px;
        border-radius:22px;
        max-width:100%;
    }
    .card::before{border-radius:23px}

    .avatar{width:96px;height:96px;margin-bottom:18px;border-width:3px}

    h1{font-size:19px;margin-bottom:5px}
    .tag{font-size:12px;margin-bottom:6px}
    .community{
        font-size:9px;letter-spacing:1.5px;padding:4px 10px;
        margin-bottom:18px;
    }
    .bio{
        font-size:12.5px;line-height:1.6;margin-bottom:22px;
    }

    .links{gap:8px}
    .links a{
        font-size:12px;padding:9px 14px;border-radius:10px;
        gap:7px;
    }
    .links a svg{width:16px;height:16px}

    #soundBtn{
        bottom:16px;right:16px;
        width:46px;height:46px;
    }
    #soundBtn svg{width:20px;height:20px}

    /* welcome mobile */
    #welcome{padding:16px}
    #welcome .panel{
        padding:36px 24px 28px;
        border-radius:24px;
    }
    #welcome .title{
        font-size:34px;letter-spacing:6px;margin-bottom:20px;
    }
    #welcome .avatar-mini{
        width:80px;height:80px;margin-bottom:18px;border-width:2px;
    }
    #welcome .info{
        font-size:13px;line-height:1.7;margin-bottom:22px;
    }
    #welcome .sub{
        font-size:10px;letter-spacing:1.5px;
    }
    #welcome .bar-label{font-size:9px;letter-spacing:1.2px}
}

/* ========== CELULAR PEQUENO ========== */
@media (max-width: 380px){
    body{padding:12px}
    .card{padding:26px 18px 22px;border-radius:20px}
    .avatar{width:84px;height:84px}
    h1{font-size:17px}
    .tag{font-size:11px}
    .bio{font-size:12px}

    .links a{font-size:11.5px;padding:8px 12px}
    .links a span{display:none}
    .links a svg{width:18px;height:18px}

    #soundBtn{bottom:12px;right:12px;width:42px;height:42px}
    #soundBtn svg{width:18px;height:18px}

    #welcome .panel{padding:30px 20px 24px;border-radius:20px}
    #welcome .title{font-size:28px;letter-spacing:5px}
    #welcome .avatar-mini{width:68px;height:68px}
    #welcome .info{font-size:12px}
}

/* ========== LANDSCAPE (celular deitado) ========== */
@media (max-height: 500px) and (orientation: landscape){
    body{padding:10px}
    .card{
        padding:20px 24px;
        max-width:520px;
        display:grid;
        grid-template-columns:auto 1fr;
        gap:20px;
        align-items:center;
        text-align:left;
    }
    .avatar{
        width:76px;height:76px;margin:0;
        grid-row:1 / span 3;
    }
    h1{font-size:17px;margin-bottom:2px}
    .tag{font-size:11px;margin-bottom:4px}
    .community{font-size:8px;margin-bottom:8px;padding:3px 8px}
    .bio{font-size:11.5px;line-height:1.4;margin-bottom:10px}
    .links{gap:6px;justify-content:flex-start}
    .links a{font-size:11px;padding:7px 12px}

    #welcome .panel{
        padding:22px 28px;
        max-width:560px;
        display:grid;
        grid-template-columns:1fr auto;
        gap:14px 24px;
        align-items:center;
        text-align:left;
    }
    #welcome .title{
        font-size:28px;letter-spacing:5px;
        margin:0;grid-column:1;
    }
    #welcome .avatar-mini{
        width:64px;height:64px;margin:0;
        grid-column:2;grid-row:1 / span 3;
    }
    #welcome .info{font-size:12px;margin:0;grid-column:1}
    #welcome .sub{font-size:9px;margin:0;grid-column:1}
    #welcome .bar{grid-column:1 / -1;margin-top:4px}
    #welcome .bar-label{grid-column:1 / -1;margin-top:6px}
}

/* ========== PREFERÊNCIA DE MENOS ANIMAÇÃO ========== */
@media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

<script>
const video    = document.getElementById('bgVideo');
const welcome  = document.getElementById('welcome');
const soundBtn = document.getElementById('soundBtn');
const barFill  = document.getElementById('barFill');
const barLabel = document.getElementById('barLabel');

video.volume = 0.35;
let muted = true;
let canEnter = false;

soundBtn.classList.add('muted');
welcome.style.cursor = 'default';

// barra de 3s
let progress = 0;
const DURATION = 3000;
const TICK = 50;
const step = (TICK / DURATION) * 100;

const interval = setInterval(() => {
    progress += step;
    if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        canEnter = true;
        barLabel.textContent = 'clique para entrar';
        barLabel.classList.add('ready');
        welcome.style.cursor = 'pointer';
    }
    barFill.style.width = progress + '%';
}, TICK);

function enter() {
    if (!canEnter) return;
    welcome.style.opacity = '0';
    setTimeout(() => welcome.remove(), 700);

    video.muted = false;
    video.volume = 0.35;
    muted = false;
    soundBtn.classList.remove('muted');

    const playPromise = video.play();
    if (playPromise !== undefined) {
        playPromise.catch(err => {
            console.warn('autoplay bloqueado:', err.name);
            video.muted = true;
            muted = true;
            soundBtn.classList.add('muted');
        });
    }
}

// touch + click (evita delay em mobile)
welcome.addEventListener('click', enter);
welcome.addEventListener('touchend', (e) => { e.preventDefault(); enter(); });

soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (muted) {
        video.muted = false;
        video.volume = 0.35;
        muted = false;
        soundBtn.classList.remove('muted');
    } else {
        video.muted = true;
        muted = true;
        soundBtn.classList.add('muted');
    }
});
</script>
