<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>alex is the best</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;color:#f0f0f5;padding:24px;
    background:#07070c;overflow-x:hidden;
}

.bg-video{
    position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    filter:blur(6px) brightness(.5) saturate(1.2);
    transform:scale(1.05);z-index:-2;pointer-events:none;
}

.glow{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
        radial-gradient(circle at 20% 30%,rgba(120,80,255,.15) 0%,transparent 50%),
        radial-gradient(circle at 80% 70%,rgba(255,80,180,.12) 0%,transparent 50%),
        radial-gradient(circle at center,rgba(0,0,0,.1) 0%,rgba(0,0,0,.7) 100%);
}

.card{
    background:rgba(16,16,24,.72);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border-radius:26px;padding:40px 34px 34px;
    text-align:center;max-width:400px;width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
    animation:fadeUp .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(28px)}
    to{opacity:1;transform:translateY(0)}
}

.avatar-wrap{position:relative;display:inline-block;margin-bottom:22px}
.avatar-wrap::before{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    background:conic-gradient(from 0deg,#a78bfa,#f472b6,#60a5fa,#a78bfa);
    opacity:.55;filter:blur(12px);animation:spin 6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar{
    position:relative;width:110px;height:110px;border-radius:50%;
    object-fit:cover;border:3px solid rgba(255,255,255,.15);display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s;
}
.avatar:hover{transform:scale(1.05)}

h1{
    font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;
    background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

.tag{font-size:13px;color:#7a7a8c;margin-bottom:8px;font-weight:500}

.community{
    display:inline-block;font-size:10px;color:#c4b5fd;letter-spacing:1.8px;
    text-transform:uppercase;font-weight:700;padding:5px 12px;border-radius:20px;
    background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
    margin-bottom:20px;
}

.bio{font-size:13.5px;color:#a8a8b8;line-height:1.65;margin-bottom:22px}

.links{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.links a{
    color:#eaeaea;text-decoration:none;font-size:12.5px;
    padding:10px 18px;border-radius:11px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
    transition:all .2s;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;
}
.links a svg{transition:transform .2s}
.links a:hover{
    background:rgba(255,255,255,.1);border-color:rgba(167,139,250,.3);
    transform:translateY(-2px);box-shadow:0 8px 20px rgba(167,139,250,.15);
}
.links a:hover svg{transform:scale(1.12)}

#overlay{
    position:fixed;inset:0;z-index:9999;
    background:rgba(5,5,10,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .6s;
}
#overlay .inner{
    color:#fff;font-size:13px;font-weight:600;letter-spacing:3px;
    text-transform:uppercase;padding:18px 36px;
    border:1px solid rgba(255,255,255,.2);border-radius:50px;
    background:rgba(255,255,255,.02);
    animation:pulse 2s ease-in-out infinite;
    display:flex;align-items:center;gap:12px;
}
#overlay .inner::before{
    content:'';width:8px;height:8px;border-radius:50%;
    background:#a78bfa;box-shadow:0 0 14px #a78bfa;
}
@keyframes pulse{
    0%,100%{opacity:.55;transform:scale(1)}
    50%{opacity:1;transform:scale(1.02)}
}

@media (max-width:480px){
    body{padding:16px}
    .card{padding:32px 22px 26px}
    .avatar{width:96px;height:96px}
}
</style>
</head>

</div>

<div id="overlay">

</div>

<script>
    document.getElementById('overlay').addEventListener('click', () => {
        const o = document.getElementById('overlay');
        o.style.opacity = '0';
